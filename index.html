<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Vercel</title>

</head>

<body>

    <h1>🚀 Test Vercel</h1>

    <p>Mon premier mini-projet.</p>

    <button id="testButton">
        Tester
    </button>


    <button id="notificationButton">
        🔔 Activer les notifications
    </button>

    <p id="result"></p>

    <script>

        // Test API
        document.getElementById("testButton").addEventListener("click", async () => {

            const response = await fetch("/api/hello");
            const data = await response.json();

            document.getElementById("result").textContent = data.message;

        });

        function urlBase64ToUint8Array(base64String) {

            const padding = "=".repeat((4 - base64String.length % 4) % 4);

            const base64 = (base64String + padding)
                .replace(/-/g, "+")
                .replace(/_/g, "/");

            const rawData = window.atob(base64);

            return Uint8Array.from(
                [...rawData].map(char => char.charCodeAt(0))
            );
        }


        document.getElementById("notificationButton").addEventListener("click", async () => {

            const permission = await Notification.requestPermission();

            if (permission !== "granted") {
                console.log("Notifications refusées");
                return;
            }

            const registration = await navigator.serviceWorker.ready;

            const subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array("BCuKYcI3oXaw4ISfEq0sb1objS_lpN3p7cKBjGUrc27_5vI8JhJGIugH21NHTerbRrmNr3T5gVA4S9ePf-uba2E")
            });
            try {

                const response = await fetch("/api/sub", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(subscription)
                });

                const data = await response.json();

                console.log("Réponse API :", data);
                console.log("Push Subscription :", subscription);

            } catch (error) {

                console.error("Erreur :", error);

            }

        });

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js")
                .then(() => {
                    console.log("Service Worker enregistré !");
                })
                .catch(error => {
                    console.error("Erreur Service Worker :", error);
                });
        }

    </script>

</body>

</html>
